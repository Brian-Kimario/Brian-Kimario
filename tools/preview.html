<!doctype html>
<meta charset="utf-8">
<title>profile preview</title>
<!--
  Local preview of the panels at GitHub's README column width, on GitHub's dark
  background. Open this file directly in a browser after running build.sh.
  Browsers cache SVGs hard — shift-reload if a change doesn't show up.
-->
<style>
  body { background:#0d1117; margin:0; padding:32px 0;
         font:16px/1.6 -apple-system, "Segoe UI", sans-serif; color:#e6edf3 }
  .wrap { max-width:860px; margin:0 auto }
  img { max-width:100%; display:block; margin:0 auto 22px }
  .note { color:#8b949e; font-size:.8em; text-align:center; margin-bottom:24px }
</style>
<div class="wrap">
  <p class="note">README column width · GitHub dark</p>
  <img src="../assets/hero.svg" alt="hero">
  <img src="../assets/stack.svg" alt="stack">
  <img src="../assets/projects.svg" alt="projects">
  <img src="../assets/stats.svg" alt="stats">
</div>
